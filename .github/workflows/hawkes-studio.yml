name: Hawkes Studio

# Tells Hawkes Studio about every push to beta or main, and build-* tags, so it takes it from there (the project's builds,
# the beta site, playtests, going live). No secrets: the workflow proves which repo and branch it is with GitHub's
# signed OIDC token.

on:
  push:
    branches: [beta, main]
    tags: ['build-*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hawkes-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell Hawkes Studio
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://studio.hawkesgen.ai/o/j-studio-4f12" | jq -r .value)
          curl -sS --fail-with-body --retry 8 --retry-delay 15 --retry-max-time 240 --retry-all-errors \
            -X POST -H "Authorization: Bearer $token" https://studio.hawkesgen.ai/o/j-studio-4f12/api/hooks/github
