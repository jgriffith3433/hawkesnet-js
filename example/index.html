<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawkes Net demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #e8eaed; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; line-height: 1.5; }
  #hud b { color: #9fe870; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Hawkes Net · <span id="status">connecting…</span> · <span id="count">1 here</span><br>Move the mouse (or drag) · open this page twice<br><small id="net"></small></div>
<script type="module">
  // The SDK from this folder (npm: import { lobby } from '@hawkesgen/net'). ?net= another Hawkes Net (an origin);
  // ?project= your project. On a Studio beta site the page names beta Hawkes Net (window.HAWKES_NET_ENDPOINT).
  import { lobby, VERSION } from '../hawkes-net.mjs';
  import { installNetPlaytest } from './net-playtest.mjs';
  const q = new URLSearchParams(location.search);
  const endpoint = q.get('net') || undefined;
  document.getElementById('net').textContent = `@hawkesgen/net ${VERSION} on ` + (endpoint || globalThis.HAWKES_NET_ENDPOINT || 'https://net.hawkesgen.ai').replace(/^https?:\/\//, '');
  const name = 'Player ' + Math.floor(Math.random() * 900 + 100);
  // No liveHosts: every page gets the project's free test rooms.
  // Only name an endpoint when asked: an endpoint given as undefined would override the SDK's default.
  const opts = { project: q.get('project') || 'netdemo', transport: 'relay', ...(endpoint ? { endpoint } : {}) };
  const net = lobby({ ...opts, name });
  net.join('js-demo');
  const me = { x: 0.5, y: 0.5 };
  let labelRects = [], canvasSize = [0, 0];
  const others = new Map();
  net.onPose((id, s) => others.set(id, { x: s.p[0], y: s.p[1] }));
  net.when('peer:leave', ({ peer }) => others.delete(peer.id));
  net.when('status', ({ status }) => { document.getElementById('status').innerHTML = `<b>${status}</b> as ${name}`; });
  const move = (e) => { me.x = e.clientX / innerWidth; me.y = e.clientY / innerHeight; };
  addEventListener('pointermove', move);
  addEventListener('pointerdown', move);
  setInterval(() => net.pose([me.x, me.y, 0]), 50);

  // Studio's playtest bot (net-playtest.mjs): a second player in this page, the dot moved by real pointer input.
  const pointer = (x, y) => dispatchEvent(new PointerEvent('pointermove', { clientX: x * innerWidth, clientY: y * innerHeight, bubbles: true }));
  installNetPlaytest({
    product: 'hawkes-net-js',
    where: (endpoint || globalThis.HAWKES_NET_ENDPOINT || 'https://net.hawkesgen.ai').replace(/^https?:\/\//, ''),
    main: () => net,
    openBot: async () => { const b = lobby({ ...opts, name: 'Playtest bot', log: false }); b.join('js-demo'); return b; },
    drive: async (step) => { for (let i = 0; i <= 30; i++) { pointer(0.2 + i * 0.02, 0.3 + Math.sin(i / 5) * 0.1); await step(60); } },
    myPos: () => [me.x, me.y, 0],
    shownPos: (id) => { const o = others.get(id); return o ? [o.x, o.y, 0] : null; },
    botPose: (u) => [0.25 + 0.5 * u, 0.75, 0],
    tolerance: 0.02,
    extra: async ({ check, bot, until, wait }) => {
      const readable = (n) => labelRects.length >= n && labelRects.every((l) => l.x >= 0 && l.y >= 0 && l.x + l.w <= canvasSize[0] && l.y + l.h <= canvasSize[1]) &&
        labelRects.every((a, i) => labelRects.every((b, j) => j <= i || !hit(a, b)));
      const meet = async (x, y) => { pointer(x, y); bot.pose([x, y, 0], 0); await until(() => { const o = others.get(bot.id); return o && Math.hypot(o.x - x, o.y - y) < 0.02 && Math.hypot(me.x - x, me.y - y) < 0.02; }, 5000, `both players to be at ${x}, ${y}`); await wait(200); };
      await check('Two players on the same spot show two readable labels', async () => {
        await meet(0.5, 0.5);
        await until(() => readable(2), 3000, () => `two labels that do not overlap (${JSON.stringify(labelRects.map((l) => [l.label, Math.round(l.x), Math.round(l.y)]))})`);
        return labelRects.map((l) => l.label).join(' / ');
      });
      await check('Labels stay inside the canvas at every edge', async () => {
        for (const [x, y] of [[0, 0], [1, 0], [1, 1], [0, 1], [0.5, 0], [1, 0.5], [0.5, 1], [0, 0.5]]) {
          await meet(x, y);
          await until(() => readable(2), 3000, () => `both labels inside the canvas and apart at ${x}, ${y} (${JSON.stringify(labelRects.map((l) => [Math.round(l.x), Math.round(l.y), Math.round(l.w)]))} in ${canvasSize})`);
        }
        return 'corners and sides';
      });
    },
  });

  const c = document.getElementById('c'), g = c.getContext('2d');
  // Labels: each dot's name goes beside it, moved to the first free spot (right, left, below, above, then rows further out)
  // so two nearby dots, or two on the same spot, never write over each other, and clamped to stay inside the canvas.
  const hit = (a, b, pad = 0) => a.x < b.x + b.w + pad && b.x < a.x + a.w + pad && a.y < b.y + b.h + pad && b.y < a.y + a.h + pad;
  function layoutLabels(dots, W, H, d) {
    const R = 12 * d, gap = 4 * d, h = 16 * d, pad = 2 * d, placed = [];
    g.font = `${12 * d}px system-ui`;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, Math.max(lo, hi)));
    const discs = dots.map((o) => ({ x: o.cx - R, y: o.cy - R, w: 2 * R, h: 2 * R }));
    return dots.map((o, i) => {
      const w = g.measureText(o.label).width + 8 * d, row = h + pad;
      const cands = [[R + gap, -h / 2], [-R - gap - w, -h / 2], [-w / 2, R + gap], [-w / 2, -R - gap - h], [R + gap, R], [-R - gap - w, R], [R + gap, -R - h], [-R - gap - w, -R - h]];
      for (let k = 1; k <= dots.length + 3; k++) for (const sgn of [1, -1]) { cands.push([R + gap, sgn * k * row - h / 2], [-R - gap - w, sgn * k * row - h / 2]); }
      let pick = null;
      for (const [dx, dy] of cands) {
        const r = { x: clamp(o.cx + dx, 0, W - w), y: clamp(o.cy + dy, 0, H - h), w, h };
        if (!placed.some((p) => hit(r, p, pad)) && !discs.some((q, j) => j !== i && hit(r, q))) { pick = r; break; }
      }
      pick ||= { x: clamp(o.cx + R + gap, 0, W - w), y: clamp(o.cy - h / 2, 0, H - h), w, h };
      placed.push(pick);
      return { ...pick, label: o.label };
    });
  }
  (function draw() {
    const d = devicePixelRatio;
    c.width = innerWidth * d; c.height = innerHeight * d;
    const dots = [{ cx: me.x * c.width, cy: me.y * c.height, color: '#ffd84d', label: name + ' (you)' }]; // you first: your label gets the best spot
    for (const [id, o] of others) { const p = net.peers.get(id); if (p) dots.push({ cx: o.x * c.width, cy: o.y * c.height, color: p.color || '#7fb3ff', label: p.name || id }); }
    for (const o of dots) { g.fillStyle = o.color; g.beginPath(); g.arc(o.cx, o.cy, 12 * d, 0, Math.PI * 2); g.fill(); }
    const labels = layoutLabels(dots, c.width, c.height, d);
    g.textBaseline = 'middle';
    for (const l of labels) {
      g.fillStyle = 'rgba(14,17,22,.78)'; g.beginPath(); g.roundRect(l.x, l.y, l.w, l.h, 4 * d); g.fill();
      g.fillStyle = '#e8eaed'; g.font = `${12 * d}px system-ui`; g.fillText(l.label, l.x + 4 * d, l.y + l.h / 2);
    }
    labelRects = labels.map((l) => ({ label: l.label, x: l.x, y: l.y, w: l.w, h: l.h }));
    canvasSize = [c.width, c.height];
    document.getElementById('count').textContent = `${net.peers.size + 1} here`;
    requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
